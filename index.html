<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
/* ===== Design Tokens ===== */
:root {
  /* Colors — OKLCH-inspired, brand-tinted dark */
  --bg-base: #0c1222;
  --bg-surface: #141d32;
  --bg-surface-hover: #1a2540;
  --bg-elevated: #1e2d4a;
  --border: #243352;
  --border-subtle: #1c2a45;

  --text-primary: #e8edf5;
  --text-secondary: #8b9bc0;
  --text-tertiary: #5a6d94;

  --accent-blue: #4c8dff;
  --accent-blue-dim: #2a4a8a;
  --accent-green: #34d399;
  --accent-green-dim: #0d3d2e;
  --accent-red: #f87171;
  --accent-red-dim: #4a1c1c;
  --accent-yellow: #fbbf24;
  --accent-yellow-dim: #3d2e0a;
  --accent-purple: #a78bfa;
  --accent-purple-dim: #2d1f5e;
  --accent-cyan: #22d3ee;
  --accent-gray: #475a7a;

  /* GPU model badge colors */
  --badge-a100: #4c8dff;
  --badge-a100-bg: #1a2f5c;
  --badge-h100: #a78bfa;
  --badge-h100-bg: #2d1f5e;
  --badge-ada: #34d399;
  --badge-ada-bg: #0d3d2e;
  --badge-p100: #fbbf24;
  --badge-p100-bg: #3d2e0a;
  --badge-k80: #475a7a;
  --badge-k80-bg: #1c2a45;

  /* Spacing — 8px grid */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
  --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

  /* Typography */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --text-xs: 0.6875rem;
  --text-sm: 0.8125rem;
  --text-base: 0.9375rem;
  --text-lg: 1.125rem;
  --text-xl: 1.375rem;
  --text-2xl: 1.75rem;

  /* Motion */
  --duration-fast: 120ms;
  --duration-default: 200ms;
  --duration-slow: 320ms;
  --ease-out: cubic-bezier(0.0, 0.0, 0.2, 1);
  --ease-in-out: cubic-bezier(0.4, 0.0, 0.2, 1);

  /* Radii */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans); background: var(--bg-base); color: var(--text-primary);
  min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.container { max-width: 1200px; margin: 0 auto; padding: var(--sp-6); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== Header ===== */
.header { padding: var(--sp-8) 0 var(--sp-4); text-align: center; }
.header h1 {
  font-size: var(--text-2xl); font-weight: 700; letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .meta {
  font-family: var(--font-mono); font-size: var(--text-xs);
  color: var(--text-tertiary); margin-top: var(--sp-2);
  display: flex; align-items: center; justify-content: center; gap: var(--sp-3);
}
.header .meta .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
}

/* ===== Cluster Tabs ===== */
.tabs { display: flex; justify-content: center; gap: var(--sp-2); margin-bottom: var(--sp-6); }
.tab {
  font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 500;
  padding: var(--sp-2) var(--sp-5); border-radius: var(--radius-full);
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  color: var(--text-secondary); cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-out),
              border-color var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out);
}
.tab:hover { background: var(--bg-surface-hover); border-color: var(--border); }
.tab:active { transform: scale(0.98); }
.tab.active {
  background: var(--accent-blue-dim); border-color: var(--accent-blue);
  color: var(--accent-blue);
}
.tab.offline { opacity: 0.35; pointer-events: none; }

/* ===== Stats Row ===== */
.stats {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: var(--sp-3); margin-bottom: var(--sp-6);
}
.stat-card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: var(--sp-4) var(--sp-3);
  text-align: center;
  transition: border-color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out);
}
.stat-card:hover { border-color: var(--border); transform: translateY(-1px); }
.stat-card .value {
  font-family: var(--font-mono); font-size: var(--text-xl); font-weight: 700;
  line-height: 1.2;
}
.stat-card .label {
  font-size: var(--text-xs); color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.08em; margin-top: var(--sp-1);
}
.stat-card.in-use .value { color: var(--accent-red); }
.stat-card.free .value { color: var(--accent-green); }
.stat-card.down .value { color: var(--accent-gray); }
.stat-card.total .value { color: var(--accent-blue); }
.stat-card.queue .value { color: var(--accent-yellow); }
.stat-card.users .value { color: var(--accent-purple); }

/* ===== Two-Column Layout ===== */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); margin-bottom: var(--sp-6); }

/* ===== Panels ===== */
.panel {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg); overflow: hidden;
}
.panel-header {
  padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border-subtle);
  display: flex; justify-content: space-between; align-items: center;
}
.panel-title { font-size: var(--text-sm); font-weight: 600; }
.panel-badge {
  font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 600;
  padding: var(--sp-1) var(--sp-2); border-radius: var(--radius-sm);
}
.panel-body { padding: 0; }
.panel-scroll { max-height: 360px; overflow-y: auto; }
.panel-scroll::-webkit-scrollbar { width: 4px; }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ===== Table ===== */
.data-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.data-table th {
  text-align: left; font-size: var(--text-xs); font-weight: 600;
  color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em;
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border-subtle);
  position: sticky; top: 0; background: var(--bg-surface); z-index: 1;
}
.data-table td { padding: var(--sp-2) var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr { transition: background-color var(--duration-fast) var(--ease-out); }
.data-table tr:hover { background: var(--bg-surface-hover); }
.data-table .user-cell { font-weight: 600; font-family: var(--font-mono); font-size: var(--text-xs); }
.data-table .num-cell { font-family: var(--font-mono); font-weight: 600; text-align: center; }
.data-table .muted { color: var(--text-tertiary); }

.gpu-bar-track {
  width: 80px; height: 4px; background: var(--border-subtle);
  border-radius: 2px; overflow: hidden;
}
.gpu-bar-fill { height: 100%; border-radius: 2px; background: var(--accent-red); min-width: 2px; }

.reason {
  font-family: var(--font-mono); font-size: var(--text-xs);
  padding: 2px var(--sp-2); border-radius: var(--radius-sm);
  background: var(--accent-yellow-dim); color: var(--accent-yellow);
}

/* ===== Section Title ===== */
.section-title {
  font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: var(--sp-4); padding-bottom: var(--sp-2);
  border-bottom: 1px solid var(--border-subtle);
}

/* ===== Node Grid ===== */
.node-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: var(--sp-3); margin-bottom: var(--sp-6);
}
.node-card {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg); padding: var(--sp-4);
  transition: border-color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out);
}
.node-card:hover { border-color: var(--border); transform: translateY(-1px); }
.node-card.down { opacity: 0.35; }
.node-card.down:hover { transform: none; }
.node-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-3); }
.node-name { font-family: var(--font-mono); font-weight: 700; font-size: var(--text-base); }
.node-badge {
  font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 600;
  padding: 2px var(--sp-2); border-radius: var(--radius-sm);
}
.node-badge.A100 { background: var(--badge-a100-bg); color: var(--badge-a100); }
.node-badge.H100 { background: var(--badge-h100-bg); color: var(--badge-h100); }
.node-badge.ADA6000 { background: var(--badge-ada-bg); color: var(--badge-ada); }
.node-badge.P100 { background: var(--badge-p100-bg); color: var(--badge-p100); }
.node-badge.K80 { background: var(--badge-k80-bg); color: var(--badge-k80); }

.slots { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
.slot {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 700;
  transition: transform var(--duration-fast) var(--ease-out);
}
.slot:hover { transform: scale(1.1); }
.slot.used { background: var(--accent-red-dim); color: var(--accent-red); border: 1px solid rgba(248,113,113,0.2); }
.slot.free { background: var(--accent-green-dim); color: var(--accent-green); border: 1px solid rgba(52,211,153,0.15); }
.slot.off { background: var(--bg-elevated); color: var(--text-tertiary); border: 1px solid var(--border-subtle); }

.node-status {
  font-family: var(--font-mono); font-size: var(--text-xs);
  color: var(--text-tertiary); margin-top: var(--sp-2);
}

.node-jobs { margin-top: var(--sp-3); border-top: 1px solid var(--border-subtle); padding-top: var(--sp-2); }
.nj-row {
  display: grid; grid-template-columns: 90px 32px 1fr 72px;
  gap: var(--sp-2); align-items: center;
  font-size: var(--text-xs); padding: 3px 0;
}
.nj-user { font-family: var(--font-mono); font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nj-gpus { font-family: var(--font-mono); font-weight: 700; color: var(--accent-red); text-align: center; }
.nj-name { color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nj-time { font-family: var(--font-mono); color: var(--text-tertiary); text-align: right; font-size: 0.625rem; }

/* ===== Charts ===== */
.chart-panel {
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg); padding: var(--sp-5);
}
.chart-panel h3 { font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--sp-4); }
.chart-wrap { position: relative; height: 220px; }

/* ===== Refresh FAB ===== */
.fab {
  position: fixed; bottom: var(--sp-6); right: var(--sp-6);
  width: 48px; height: 48px; border-radius: 50%; border: none;
  background: var(--accent-blue-dim); color: var(--accent-blue);
  font-size: 1.25rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--accent-blue);
  box-shadow: 0 4px 24px rgba(76,141,255,0.15);
  transition: background-color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out);
}
.fab:hover { background: var(--accent-blue); color: white; transform: scale(1.08); }
.fab:active { transform: scale(0.95); }
.fab.spinning { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Responsive ===== */
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .container { padding: var(--sp-4); }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .node-grid { grid-template-columns: 1fr; }
}

.loading-state {
  text-align: center; padding: var(--sp-12);
  font-family: var(--font-mono); color: var(--text-tertiary); font-size: var(--text-sm);
}
.empty-row { text-align: center; color: var(--text-tertiary); padding: var(--sp-8) !important; }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <h1>GPU Monitor</h1>
    <div class="meta">
      <span class="dot"></span>
      <span id="last-updated">Connecting...</span>
    </div>
  </header>

  <nav class="tabs" id="cluster-tabs"></nav>
  <main id="content"><div class="loading-state">Loading data...</div></main>
</div>

<button class="fab" id="fab" title="Refresh">&#x21bb;</button>

<script>
const REPO = 'Gonglitian/gpu-monitor';
const DATA_DIR = 'data';
const CLUSTERS = ['hpcc', 'bcc'];

let current = 'hpcc';
let data = {};
let charts = { usage: null, queue: null };

async function fetchCluster(c) {
  const r = await fetch(`https://raw.githubusercontent.com/${REPO}/main/${DATA_DIR}/${c}.json?${Date.now()}`);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadAll() {
  const results = await Promise.allSettled(CLUSTERS.map(fetchCluster));
  CLUSTERS.forEach((c, i) => { if (results[i].status === 'fulfilled') data[c] = results[i].value; });
}

function renderTabs() {
  document.getElementById('cluster-tabs').innerHTML = CLUSTERS.map(c => {
    const d = data[c], s = d?.summary;
    const label = c.toUpperCase();
    const info = s ? `${s.used}/${s.total - s.down}` : '--';
    const cls = c === current ? 'active' : (!d ? 'offline' : '');
    return `<div class="tab ${cls}" onclick="switchTo('${c}')">${label} <span style="opacity:0.6">${info}</span></div>`;
  }).join('');
}
function switchTo(c) { if (data[c]) { current = c; renderTabs(); render(); } }
window.switchTo = switchTo;

function shortReason(r) {
  if (!r) return '';
  if (r.includes('Priority')) return 'Priority';
  if (r.includes('Resources')) return 'Resources';
  if (r.includes('DOWN') || r.includes('DRAIN')) return 'Node Down';
  if (r.includes('Dependency')) return 'Dependency';
  return r.length > 16 ? r.slice(0,16) + '...' : r;
}

function render() {
  const d = data[current];
  if (!d) { document.getElementById('content').innerHTML = '<div class="loading-state">No data.</div>'; return; }
  const s = d.summary;
  const activeTotal = s.total - s.down;

  const ts = new Date(d.timestamp);
  const ago = Math.round((Date.now() - ts) / 60000);
  const agoStr = ago < 1 ? 'just now' : ago < 60 ? `${ago}m ago` : `${Math.floor(ago/60)}h ${ago%60}m ago`;
  document.getElementById('last-updated').textContent = `${current.toUpperCase()} \u00b7 updated ${agoStr}`;

  let h = '';

  // Stats
  h += `<div class="stats">
    <div class="stat-card in-use"><div class="value">${s.used}</div><div class="label">In Use</div></div>
    <div class="stat-card free"><div class="value">${s.free}</div><div class="label">Free</div></div>
    <div class="stat-card down"><div class="value">${s.down}</div><div class="label">Down</div></div>
    <div class="stat-card total"><div class="value">${activeTotal}</div><div class="label">Active</div></div>
    <div class="stat-card queue"><div class="value">${s.pending_jobs||0}</div><div class="label">Queued</div></div>
    <div class="stat-card users"><div class="value">${s.active_users||0}</div><div class="label">Users</div></div>
  </div>`;

  // Users + Queue
  const users = d.users || [];
  const pending = d.pending_jobs || [];
  const maxGpu = Math.max(1, ...users.map(u => u.running_gpus));

  h += '<div class="split">';

  h += `<div class="panel">
    <div class="panel-header">
      <span class="panel-title">Active Users</span>
      <span class="panel-badge" style="background:var(--accent-purple-dim);color:var(--accent-purple)">${users.filter(u=>u.running_gpus>0).length} users</span>
    </div>
    <div class="panel-body"><div class="panel-scroll"><table class="data-table">
      <tr><th>User</th><th style="text-align:center">GPUs</th><th></th><th style="text-align:center">Jobs</th><th style="text-align:center">Queue</th></tr>`;
  users.forEach(u => {
    if (!u.running_gpus && !u.pending_jobs) return;
    const pct = (u.running_gpus / maxGpu * 100).toFixed(0);
    h += `<tr>
      <td class="user-cell">${u.user}</td>
      <td class="num-cell" style="color:var(--accent-red)">${u.running_gpus}</td>
      <td><div class="gpu-bar-track"><div class="gpu-bar-fill" style="width:${pct}%"></div></div></td>
      <td class="num-cell">${u.running_jobs}</td>
      <td class="num-cell" style="color:${u.pending_jobs?'var(--accent-yellow)':'var(--text-tertiary)'}">${u.pending_jobs}</td>
    </tr>`;
  });
  h += '</table></div></div></div>';

  h += `<div class="panel">
    <div class="panel-header">
      <span class="panel-title">Pending Queue</span>
      <span class="panel-badge" style="background:var(--accent-yellow-dim);color:var(--accent-yellow)">${pending.length} jobs \u00b7 ${s.pending_gpus||0} GPUs</span>
    </div>
    <div class="panel-body"><div class="panel-scroll"><table class="data-table">
      <tr><th>User</th><th style="text-align:center">GPUs</th><th>Job</th><th>Reason</th></tr>`;
  if (pending.length === 0) {
    h += '<tr><td colspan="4" class="empty-row">No pending jobs</td></tr>';
  } else {
    pending.forEach(p => {
      h += `<tr>
        <td class="user-cell">${p.user}</td>
        <td class="num-cell" style="color:var(--accent-yellow)">${p.gpus}</td>
        <td class="muted" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.job_name}">${p.job_name}</td>
        <td><span class="reason">${shortReason(p.reason)}</span></td>
      </tr>`;
    });
  }
  h += '</table></div></div></div>';
  h += '</div>';

  // Nodes
  h += '<div class="section-title">Nodes</div><div class="node-grid">';
  const active = d.nodes.filter(n => n.state === 'active');
  const down = d.nodes.filter(n => n.state === 'down');
  [...active, ...down].forEach(n => {
    const isDown = n.state === 'down';
    const free = n.total - n.used;
    let slots = '';
    for (let i = 0; i < n.total; i++) {
      if (isDown) slots += '<div class="slot off">\u2013</div>';
      else if (i < n.used) slots += '<div class="slot used">X</div>';
      else slots += '<div class="slot free">O</div>';
    }
    let jobs = '';
    if (n.jobs?.length) {
      jobs = '<div class="node-jobs">';
      n.jobs.forEach(j => {
        jobs += `<div class="nj-row">
          <span class="nj-user">${j.user}</span>
          <span class="nj-gpus">${j.gpus}G</span>
          <span class="nj-name" title="${j.job_name}">${j.job_name}</span>
          <span class="nj-time">${j.elapsed}</span>
        </div>`;
      });
      jobs += '</div>';
    }
    h += `<div class="node-card ${isDown?'down':''}">
      <div class="node-top">
        <span class="node-name">${n.name}</span>
        <span class="node-badge ${n.gpu_model}">${n.gpu_model}</span>
      </div>
      <div class="slots">${slots}</div>
      <div class="node-status">${isDown ? 'DOWN' : `${free}/${n.total} free`}</div>
      ${jobs}
    </div>`;
  });
  h += '</div>';

  // Charts
  h += '<div class="split">';
  h += '<div class="chart-panel"><h3>GPU Usage</h3><div class="chart-wrap"><canvas id="chart-usage"></canvas></div></div>';
  h += '<div class="chart-panel"><h3>Queue & Users</h3><div class="chart-wrap"><canvas id="chart-queue"></canvas></div></div>';
  h += '</div>';

  document.getElementById('content').innerHTML = h;
  renderCharts(d.history || []);
}

function renderCharts(history) {
  Object.values(charts).forEach(c => c?.destroy());
  charts = { usage: null, queue: null };
  if (!history.length) return;

  const labels = history.map(h => new Date(h.timestamp));
  const colors = {
    grid: 'rgba(36,51,82,0.6)', tick: '#5a6d94',
    tip: { bg: '#1e2d4a', border: '#243352', title: '#e8edf5', body: '#8b9bc0' },
  };
  const baseOpts = {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { labels: { color: colors.tick, usePointStyle: true, pointStyle: 'circle', boxWidth: 6, font: { size: 11, family: 'Inter' } } },
      tooltip: { backgroundColor: colors.tip.bg, borderColor: colors.tip.border, borderWidth: 1,
        titleColor: colors.tip.title, bodyColor: colors.tip.body, titleFont: { family: 'Inter' }, bodyFont: { family: 'JetBrains Mono', size: 12 },
        padding: 10, cornerRadius: 8 },
    },
    scales: {
      x: { type: 'time', time: { tooltipFormat: 'MMM d, HH:mm' }, grid: { color: colors.grid }, ticks: { color: colors.tick, maxTicksLimit: 8, font: { size: 10 } } },
      y: { beginAtZero: true, grid: { color: colors.grid }, ticks: { color: colors.tick, font: { size: 10, family: 'JetBrains Mono' } } },
    },
  };
  const line = (c, bg) => ({ borderColor: c, backgroundColor: bg, fill: true, tension: 0.35, pointRadius: 0, borderWidth: 1.5 });

  const c1 = document.getElementById('chart-usage');
  if (c1) charts.usage = new Chart(c1, {
    type: 'line', data: { labels, datasets: [
      { label: 'Used', data: history.map(h=>h.used), ...line('#f87171','rgba(248,113,113,0.08)') },
      { label: 'Free', data: history.map(h=>h.free), ...line('#34d399','rgba(52,211,153,0.08)') },
      { label: 'Down', data: history.map(h=>h.down), ...line('#475a7a','rgba(71,90,122,0.06)'), borderWidth: 1 },
    ]}, options: baseOpts,
  });

  const c2 = document.getElementById('chart-queue');
  if (c2) charts.queue = new Chart(c2, {
    type: 'line', data: { labels, datasets: [
      { label: 'Queued', data: history.map(h=>h.pending_jobs||0), ...line('#fbbf24','rgba(251,191,36,0.08)'), yAxisID: 'y' },
      { label: 'Users', data: history.map(h=>h.active_users||0), ...line('#a78bfa','rgba(167,139,250,0.08)'), yAxisID: 'y1' },
    ]}, options: { ...baseOpts, scales: {
      ...baseOpts.scales,
      y: { ...baseOpts.scales.y, position: 'left' },
      y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false },
        ticks: { color: '#a78bfa', font: { size: 10, family: 'JetBrains Mono' } } },
    }},
  });
}

async function init() {
  await loadAll();
  if (!data[current]) current = CLUSTERS.find(c => data[c]) || 'hpcc';
  renderTabs(); render();
}

document.getElementById('fab').addEventListener('click', async function() {
  this.classList.add('spinning');
  await loadAll(); renderTabs(); render();
  this.classList.remove('spinning');
});

setInterval(async () => { await loadAll(); renderTabs(); render(); }, 60000);
init();
</script>
</body>
</html>
