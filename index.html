<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
/* ===== Tokens ===== */
:root {
  /* Warm dark palette — brand-tinted neutrals, never pure black/gray */
  --bg-0: #111110;
  --bg-1: #191918;
  --bg-2: #222221;
  --bg-3: #2a2a28;
  --bg-hover: #2f2f2c;
  --border-0: #2a2a28;
  --border-1: #363633;

  --text-0: #eeeeec;
  --text-1: #b5b3ad;
  --text-2: #7c7b75;

  /* Single accent — warm amber */
  --accent: #e5a321;
  --accent-dim: #3d2e0a;
  --accent-text: #f0c050;

  /* Semantic — muted, not neon */
  --color-used: #e5736e;
  --color-used-dim: rgba(229,115,110,0.1);
  --color-free: #5ec49e;
  --color-free-dim: rgba(94,196,158,0.08);
  --color-down: #5a5955;
  --color-down-dim: rgba(90,89,85,0.08);
  --color-queue: #d4a03c;
  --color-queue-dim: rgba(212,160,60,0.1);
  --color-users: #9b8acd;
  --color-users-dim: rgba(155,138,205,0.1);

  /* Model badges */
  --model-a100: #7aacf5;
  --model-a100-bg: rgba(122,172,245,0.1);
  --model-h100: #b49aef;
  --model-h100-bg: rgba(180,154,239,0.1);
  --model-ada: #6bc4a0;
  --model-ada-bg: rgba(107,196,160,0.08);
  --model-p100: #d4a854;
  --model-p100-bg: rgba(212,168,84,0.1);
  --model-k80: #777770;
  --model-k80-bg: rgba(119,119,112,0.08);

  /* Spacing — 4pt base */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px; --s16: 64px;

  /* Type */
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;

  /* Motion */
  --fast: 100ms;
  --med: 180ms;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
}

/* ===== Reset ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: var(--font); background: var(--bg-0); color: var(--text-0);
  line-height: 1.55; -webkit-font-smoothing: antialiased;
  font-weight: 350;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ===== Layout ===== */
.page { max-width: 1180px; margin: 0 auto; padding: var(--s6) var(--s6) var(--s16); }

/* ===== Header — minimal, left-aligned ===== */
.hdr { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--s8); padding-top: var(--s8); }
.hdr-left { display: flex; align-items: baseline; gap: var(--s3); }
.hdr h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.03em; }
.hdr .live {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 0.6875rem; color: var(--text-2);
}
.hdr .live .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--color-free); animation: blink 2.5s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
.hdr-right { display: flex; align-items: center; gap: var(--s2); }

/* Tabs — pill style */
.tab-group { display: flex; background: var(--bg-2); border-radius: 8px; padding: 2px; }
.tab-btn {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
  padding: 5px 14px; border-radius: 6px; border: none; cursor: pointer;
  background: transparent; color: var(--text-2);
  transition: color var(--fast) var(--ease), background-color var(--fast) var(--ease);
}
.tab-btn:hover { color: var(--text-1); }
.tab-btn.on { background: var(--bg-hover); color: var(--text-0); }
.tab-btn.off { opacity: .35; pointer-events: none; }

/* ===== Stats strip — horizontal, compact ===== */
.strip {
  display: flex; gap: var(--s6); padding: var(--s4) 0;
  margin-bottom: var(--s6); border-bottom: 1px solid var(--border-0);
}
.kpi { display: flex; align-items: baseline; gap: var(--s2); }
.kpi-val { font-family: var(--mono); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.kpi-lbl { font-size: 0.6875rem; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.kpi.used .kpi-val { color: var(--color-used); }
.kpi.free .kpi-val { color: var(--color-free); }
.kpi.down .kpi-val { color: var(--color-down); }
.kpi.queue .kpi-val { color: var(--color-queue); }
.kpi.users .kpi-val { color: var(--color-users); }
.kpi-sep { width: 1px; height: 20px; background: var(--border-0); align-self: center; }

/* ===== Section labels ===== */
.sec {
  font-size: 0.6875rem; font-weight: 700; color: var(--text-2);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: var(--s4);
}

/* ===== Node Grid — primary content, top of page ===== */
.nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--s3); margin-bottom: var(--s10); }
.nd {
  background: var(--bg-1); border: 1px solid var(--border-0); border-radius: 10px; padding: var(--s4);
  transition: border-color var(--fast) var(--ease);
}
.nd:hover { border-color: var(--border-1); }
.nd.is-down { opacity: .3; }
.nd-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s3); }
.nd-name { font-family: var(--mono); font-weight: 700; font-size: 0.9375rem; }
.nd-badge {
  font-family: var(--mono); font-size: 0.5625rem; font-weight: 700;
  padding: 2px 8px; border-radius: 4px; letter-spacing: 0.04em;
}
.nd-badge.A100 { color: var(--model-a100); background: var(--model-a100-bg); }
.nd-badge.H100 { color: var(--model-h100); background: var(--model-h100-bg); }
.nd-badge.ADA6000 { color: var(--model-ada); background: var(--model-ada-bg); }
.nd-badge.P100 { color: var(--model-p100); background: var(--model-p100-bg); }
.nd-badge.K80 { color: var(--model-k80); background: var(--model-k80-bg); }

/* GPU slots — compact squares */
.slots { display: flex; flex-wrap: wrap; gap: 3px; }
.sl {
  width: 24px; height: 24px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 0.5625rem; font-weight: 700;
}
.sl.u { background: var(--color-used-dim); color: var(--color-used); }
.sl.f { background: var(--color-free-dim); color: var(--color-free); }
.sl.d { background: var(--bg-3); color: var(--text-2); }

/* GPU memory slots — wider bars for local clusters */
.slots-mem { display: flex; flex-direction: column; gap: 3px; }
.sl-mem {
  display: flex; align-items: center; gap: var(--s2); height: 22px;
  font-family: var(--mono); font-size: 0.5625rem;
}
.sl-mem-idx { color: var(--text-2); width: 18px; text-align: right; flex-shrink: 0; }
.sl-mem-bar {
  flex: 1; height: 100%; border-radius: 4px; position: relative;
  background: var(--bg-3); overflow: hidden;
}
.sl-mem-fill {
  position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px;
  transition: width var(--med) var(--ease);
}
.sl-mem-fill.hot { background: rgba(229,115,110,0.25); }
.sl-mem-fill.warm { background: rgba(212,160,60,0.2); }
.sl-mem-fill.cool { background: rgba(94,196,158,0.15); }
.sl-mem-fill.idle { background: transparent; }
.sl-mem-text {
  position: relative; z-index: 1; padding: 0 var(--s2);
  display: flex; justify-content: space-between; align-items: center;
  width: 100%; height: 100%;
}
.sl-mem-val { font-weight: 600; }
.sl-mem-fill.hot + .sl-mem-text .sl-mem-val { color: var(--color-used); }
.sl-mem-fill.warm + .sl-mem-text .sl-mem-val { color: var(--color-queue); }
.sl-mem-fill.cool + .sl-mem-text .sl-mem-val { color: var(--color-free); }
.sl-mem-fill.idle + .sl-mem-text .sl-mem-val { color: var(--text-2); }
.sl-mem-users { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; text-align: right; }
.nd-meta { font-family: var(--mono); font-size: 0.625rem; color: var(--text-2); margin-top: var(--s2); }

/* Node job list */
.nd-jobs { margin-top: var(--s3); padding-top: var(--s2); border-top: 1px solid var(--border-0); }
.jrow {
  display: grid; grid-template-columns: 80px 28px 1fr 64px;
  gap: var(--s2); align-items: center; padding: 2px 0;
  font-size: 0.625rem;
}
.jrow-u { font-family: var(--mono); font-weight: 600; color: var(--text-0); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jrow-g { font-family: var(--mono); font-weight: 700; color: var(--color-used); text-align: center; }
.jrow-n { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jrow-t { font-family: var(--mono); color: var(--text-2); text-align: right; font-size: 0.5625rem; }

/* ===== Two-col panels ===== */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); margin-bottom: var(--s10); }

/* Tables */
.pnl { background: var(--bg-1); border: 1px solid var(--border-0); border-radius: 10px; overflow: hidden; }
.pnl-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border-0);
}
.pnl-title { font-size: 0.75rem; font-weight: 700; }
.pnl-tag {
  font-family: var(--mono); font-size: 0.5625rem; font-weight: 700;
  padding: 2px 8px; border-radius: 4px;
}
.pnl-scroll { max-height: 340px; overflow-y: auto; }
.pnl-scroll::-webkit-scrollbar { width: 3px; }
.pnl-scroll::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: 2px; }

.tbl { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
.tbl th {
  text-align: left; font-size: 0.5625rem; font-weight: 700; color: var(--text-2);
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border-0);
  position: sticky; top: 0; background: var(--bg-1);
}
.tbl td { padding: var(--s1) var(--s3); border-bottom: 1px solid var(--border-0); }
.tbl tr:last-child td { border: none; }
.tbl tr { transition: background-color var(--fast) var(--ease); }
.tbl tr:hover { background: var(--bg-hover); }
.tbl .mono { font-family: var(--mono); font-weight: 600; font-size: 0.6875rem; font-variant-numeric: tabular-nums; }
.tbl .c { text-align: center; }
.tbl .dim { color: var(--text-2); }

.bar-track { width: 64px; height: 3px; background: var(--border-0); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
.bar-fill { height: 100%; background: var(--color-used); border-radius: 2px; min-width: 2px; }

.reason-tag {
  font-family: var(--mono); font-size: 0.5625rem; font-weight: 600;
  padding: 1px 6px; border-radius: 3px;
  background: var(--color-queue-dim); color: var(--color-queue);
}
.empty-msg { text-align: center; color: var(--text-2); padding: var(--s8) var(--s4); font-size: 0.75rem; }

/* ===== Charts ===== */
.chart-box { background: var(--bg-1); border: 1px solid var(--border-0); border-radius: 10px; padding: var(--s4); }
.chart-box h3 { font-size: 0.75rem; font-weight: 700; margin-bottom: var(--s3); }
.chart-area { position: relative; height: 200px; }

/* ===== Refresh ===== */
.fab {
  position: fixed; bottom: var(--s6); right: var(--s6);
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-2); border: 1px solid var(--border-1); color: var(--text-1);
  font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.fab:hover { background: var(--bg-3); color: var(--text-0); }
.fab:active { transform: scale(0.94); }
.fab.spin { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Overview ===== */
.ov-strip {
  display: flex; gap: var(--s6); padding: var(--s4) 0;
  margin-bottom: var(--s6); border-bottom: 1px solid var(--border-0);
}
.ov-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--s4); }
.ov-card {
  background: var(--bg-1); border: 1px solid var(--border-0); border-radius: 10px;
  padding: var(--s5); cursor: pointer;
  transition: border-color var(--fast) var(--ease), transform var(--fast) var(--ease);
}
.ov-card:hover { border-color: var(--border-1); transform: translateY(-1px); }
.ov-card.is-off { opacity: .35; pointer-events: none; }
.ov-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s3); }
.ov-card-name { font-family: var(--mono); font-weight: 800; font-size: 1rem; letter-spacing: 0.02em; }
.ov-card-ts { font-family: var(--mono); font-size: 0.5625rem; color: var(--text-2); }
.ov-card-nums { display: flex; gap: var(--s5); align-items: baseline; margin-bottom: var(--s3); }
.ov-big { font-family: var(--mono); font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.ov-big.free { color: var(--color-free); }
.ov-big.full { color: var(--color-used); }
.ov-sub { font-family: var(--mono); font-size: 0.6875rem; color: var(--text-2); display: flex; flex-direction: column; gap: 2px; }
.ov-sub span { white-space: nowrap; }
.ov-seg-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 1px; margin-bottom: var(--s3); }
.ov-seg { transition: width var(--med) var(--ease); }
.ov-seg.used { background: var(--color-used); }
.ov-seg.free { background: var(--color-free); }
.ov-seg.down { background: var(--color-down); }
.ov-slots { display: flex; flex-wrap: wrap; gap: 2px; }
.ov-sl {
  width: 16px; height: 16px; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 0.4375rem; font-weight: 700;
}
.ov-sl.u { background: var(--color-used-dim); color: var(--color-used); }
.ov-sl.f { background: var(--color-free-dim); color: var(--color-free); }
.ov-sl.d { background: var(--bg-3); color: var(--text-2); }
.ov-nd-label {
  font-family: var(--mono); font-size: 0.5rem; color: var(--text-2);
  margin-right: 4px; align-self: center;
}
.ov-nd-group { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; margin-bottom: 3px; }

/* ===== Responsive ===== */
@media (max-width:900px) { .cols { grid-template-columns: 1fr; } }
@media (max-width:640px) {
  .page { padding: var(--s4); }
  .hdr { flex-direction: column; gap: var(--s3); }
  .strip, .ov-strip { flex-wrap: wrap; gap: var(--s4); }
  .nodes, .ov-cards { grid-template-columns: 1fr; }
  .kpi-sep { display: none; }
}
</style>
</head>
<body>
<div class="page">

  <header class="hdr">
    <div class="hdr-left">
      <h1>GPU Monitor</h1>
      <span class="live"><span class="dot"></span><span id="ts">connecting</span></span>
    </div>
    <div class="hdr-right">
      <div class="tab-group" id="tabs"></div>
    </div>
  </header>

  <div id="app"><div class="empty-msg">Loading...</div></div>

</div>
<button class="fab" id="fab" title="Refresh">&#x21bb;</button>

<script>
const REPO='Gonglitian/gpu-monitor', DIR='data', CL=['hpcc','bcc','tasl'];
const NO_SLURM=new Set(['tasl']); // clusters without job scheduler
let cur='overview', D={}, CH={u:null,q:null};

async function load(){
  const r=await Promise.allSettled(CL.map(c=>fetch(`https://raw.githubusercontent.com/${REPO}/main/${DIR}/${c}.json?${Date.now()}`).then(r=>{if(!r.ok)throw 0;return r.json()})));
  CL.forEach((c,i)=>{if(r[i].status==='fulfilled')D[c]=r[i].value});
}

function tabs(){
  const ovCls=cur==='overview'?'on':'';
  let html=`<button class="tab-btn ${ovCls}" onclick="sw('overview')">ALL</button>`;
  html+=CL.map(c=>{
    const s=D[c]?.summary, info=s?`${s.used}/${s.total-s.down}`:'--';
    const cls=c===cur?'on':(!D[c]?'off':'');
    return `<button class="tab-btn ${cls}" onclick="sw('${c}')">${c.toUpperCase()} ${info}</button>`;
  }).join('');
  document.getElementById('tabs').innerHTML=html;
}
function sw(c){if(c==='overview'||D[c]){cur=c;tabs();render()}} window.sw=sw;

function shortR(r){
  if(!r)return'';
  if(r.includes('Priority'))return'Priority';
  if(r.includes('Resources'))return'Resources';
  if(r.includes('DOWN')||r.includes('DRAIN'))return'Node Down';
  return r.length>14?r.slice(0,14)+'…':r;
}

function renderOverview(){
  // Aggregate stats
  let tUsed=0,tFree=0,tDown=0,tTotal=0,tUsers=new Set();
  CL.forEach(c=>{const s=D[c]?.summary;if(!s)return;tUsed+=s.used;tFree+=s.free;tDown+=s.down;tTotal+=s.total;
    (D[c].users||[]).forEach(u=>{if(u.running_gpus>0)tUsers.add(u.user)})});
  const tAt=tTotal-tDown;

  let h='';
  // Global stats strip
  h+=`<div class="ov-strip">
    <div class="kpi used"><span class="kpi-val">${tUsed}</span><span class="kpi-lbl">used</span></div><div class="kpi-sep"></div>
    <div class="kpi free"><span class="kpi-val">${tFree}</span><span class="kpi-lbl">free</span></div><div class="kpi-sep"></div>
    ${tDown?`<div class="kpi down"><span class="kpi-val">${tDown}</span><span class="kpi-lbl">down</span></div><div class="kpi-sep"></div>`:''}
    <div class="kpi"><span class="kpi-val">${tAt}</span><span class="kpi-lbl">total</span></div><div class="kpi-sep"></div>
    <div class="kpi users"><span class="kpi-val">${tUsers.size}</span><span class="kpi-lbl">users</span></div>
  </div>`;

  // Per-cluster cards
  h+='<div class="ov-cards">';
  CL.forEach(c=>{
    const d=D[c];
    if(!d){h+=`<div class="ov-card is-off"><div class="ov-card-top"><span class="ov-card-name">${c.toUpperCase()}</span></div><div class="empty-msg">Offline</div></div>`;return}
    const s=d.summary, at=s.total-s.down;
    const t=new Date(d.timestamp), ago=Math.round((Date.now()-t)/60000);
    const agoS=ago<1?'now':ago<60?ago+'m':Math.floor(ago/60)+'h '+ago%60+'m';

    // Mini GPU slots per node
    let slots='';
    const on=d.nodes.filter(n=>n.state==='active'), off=d.nodes.filter(n=>n.state==='down');
    [...on,...off].forEach(n=>{
      const dn=n.state==='down';
      slots+=`<div class="ov-nd-group"><span class="ov-nd-label">${n.name}</span>`;
      for(let i=0;i<n.total;i++){
        if(dn)slots+='<div class="ov-sl d">–</div>';
        else if(i<n.used)slots+='<div class="ov-sl u">×</div>';
        else slots+='<div class="ov-sl f">○</div>';
      }
      slots+='</div>';
    });

    h+=`<div class="ov-card" onclick="sw('${c}')">
      <div class="ov-card-top"><span class="ov-card-name">${c.toUpperCase()}</span><span class="ov-card-ts">${agoS} ago</span></div>
      <div class="ov-card-nums">
        <span class="ov-big ${s.free>0?'free':'full'}">${s.free}</span>
        <div class="ov-sub"><span style="color:var(--color-free)">free</span><span>${s.used} used${s.down?' · '+s.down+' down':''} / ${at}</span></div>
      </div>
      <div class="ov-seg-bar">
        ${s.used?`<div class="ov-seg used" style="width:${(s.used/s.total*100).toFixed(1)}%"></div>`:''}
        ${s.free?`<div class="ov-seg free" style="width:${(s.free/s.total*100).toFixed(1)}%"></div>`:''}
        ${s.down?`<div class="ov-seg down" style="width:${(s.down/s.total*100).toFixed(1)}%"></div>`:''}
      </div>
      ${slots}
    </div>`;
  });
  h+='</div>';

  document.getElementById('ts').textContent='Overview';
  document.getElementById('app').innerHTML=h;
}

function render(){
  if(cur==='overview'){renderOverview();return}
  const d=D[cur];
  if(!d){document.getElementById('app').innerHTML='<div class="empty-msg">No data.</div>';return}
  const s=d.summary, at=s.total-s.down, isLocal=NO_SLURM.has(cur);

  // Timestamp
  const t=new Date(d.timestamp), ago=Math.round((Date.now()-t)/60000);
  const agoS=ago<1?'now':ago<60?ago+'m':Math.floor(ago/60)+'h '+ago%60+'m';
  document.getElementById('ts').textContent=`${cur.toUpperCase()} · ${agoS} ago`;

  let h='';

  // Stats strip
  h+=`<div class="strip">
    <div class="kpi used"><span class="kpi-val">${s.used}</span><span class="kpi-lbl">used</span></div><div class="kpi-sep"></div>
    <div class="kpi free"><span class="kpi-val">${s.free}</span><span class="kpi-lbl">free</span></div><div class="kpi-sep"></div>
    ${s.down?`<div class="kpi down"><span class="kpi-val">${s.down}</span><span class="kpi-lbl">down</span></div><div class="kpi-sep"></div>`:''}
    <div class="kpi"><span class="kpi-val">${at}</span><span class="kpi-lbl">total</span></div>
    ${!isLocal?`<div class="kpi-sep"></div><div class="kpi queue"><span class="kpi-val">${s.pending_jobs||0}</span><span class="kpi-lbl">queued</span></div>`:''}
    <div class="kpi-sep"></div><div class="kpi users"><span class="kpi-val">${s.active_users||0}</span><span class="kpi-lbl">users</span></div>
  </div>`;

  // NODES FIRST
  h+='<div class="sec">Nodes</div><div class="nodes">';
  const on=d.nodes.filter(n=>n.state==='active'), off=d.nodes.filter(n=>n.state==='down');
  [...on,...off].forEach(n=>{
    const dn=n.state==='down', fr=n.total-n.used;
    let sl='', hasMem=isLocal&&n.gpu_details?.length;
    if(hasMem){
      sl='<div class="slots-mem">';
      n.gpu_details.forEach(g=>{
        const pct=g.mem_total?((g.mem_used/g.mem_total)*100).toFixed(0):0;
        const uG=(g.mem_used/1024).toFixed(0), tG=(g.mem_total/1024).toFixed(0);
        const heat=+pct>=80?'hot':+pct>=30?'warm':+pct>0?'cool':'idle';
        const usr=g.users?.length?g.users.join(', '):'';
        sl+=`<div class="sl-mem"><span class="sl-mem-idx">${g.index}</span><div class="sl-mem-bar"><div class="sl-mem-fill ${heat}" style="width:${pct}%"></div><div class="sl-mem-text"><span class="sl-mem-val">${uG}/${tG}G</span><span class="sl-mem-users">${usr}</span></div></div></div>`;
      });
      sl+='</div>';
    } else {
      for(let i=0;i<n.total;i++){
        if(dn)sl+='<div class="sl d">–</div>';
        else if(i<n.used)sl+='<div class="sl u">×</div>';
        else sl+='<div class="sl f">○</div>';
      }
    }
    let jobs='';
    if(n.jobs?.length){
      jobs='<div class="nd-jobs">';
      n.jobs.forEach(j=>{
        jobs+=`<div class="jrow"><span class="jrow-u">${j.user}</span><span class="jrow-g">${j.gpus}</span><span class="jrow-n" title="${j.job_name}">${j.job_name}</span><span class="jrow-t">${j.elapsed}</span></div>`;
      });
      jobs+='</div>';
    }
    h+=`<div class="nd ${dn?'is-down':''}">
      <div class="nd-top"><span class="nd-name">${n.name}</span><span class="nd-badge ${n.gpu_model}">${n.gpu_model}</span></div>
      ${hasMem?sl:`<div class="slots">${sl}</div>`}
      <div class="nd-meta">${dn?'offline':fr+'/'+n.total+' free'}</div>
      ${jobs}
    </div>`;
  });
  h+='</div>';

  // Users + Queue
  const us=d.users||[], pq=d.pending_jobs||[], mx=Math.max(1,...us.map(u=>u.running_gpus));
  h+=isLocal?'<div class="cols" style="grid-template-columns:1fr">':'<div class="cols">';

  h+=`<div class="pnl">
    <div class="pnl-head"><span class="pnl-title">Users</span><span class="pnl-tag" style="background:var(--color-users-dim);color:var(--color-users)">${us.filter(u=>u.running_gpus>0).length} active</span></div>
    <div class="pnl-scroll"><table class="tbl"><tr><th>User</th><th class="c">GPUs</th><th></th><th class="c">Jobs</th>${isLocal?'':'<th class="c">Queue</th>'}</tr>`;
  us.forEach(u=>{
    if(!u.running_gpus&&!u.pending_jobs)return;
    const p=(u.running_gpus/mx*100).toFixed(0);
    h+=`<tr><td class="mono">${u.user}</td><td class="mono c" style="color:var(--color-used)">${u.running_gpus}</td><td><div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div></td><td class="mono c">${u.running_jobs}</td>${isLocal?'':`<td class="mono c" style="color:${u.pending_jobs?'var(--color-queue)':'var(--text-2)'}">${u.pending_jobs}</td>`}</tr>`;
  });
  h+='</table></div></div>';

  if(!isLocal){
    h+=`<div class="pnl">
      <div class="pnl-head"><span class="pnl-title">Queue</span><span class="pnl-tag" style="background:var(--color-queue-dim);color:var(--color-queue)">${pq.length} jobs · ${s.pending_gpus||0} GPUs</span></div>
      <div class="pnl-scroll"><table class="tbl"><tr><th>User</th><th class="c">GPUs</th><th>Job</th><th>Reason</th></tr>`;
    if(!pq.length)h+='<tr><td colspan="4" class="empty-msg">No pending jobs</td></tr>';
    else pq.forEach(p=>{
      h+=`<tr><td class="mono">${p.user}</td><td class="mono c" style="color:var(--color-queue)">${p.gpus}</td><td class="dim" style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.job_name}">${p.job_name}</td><td><span class="reason-tag">${shortR(p.reason)}</span></td></tr>`;
    });
    h+='</table></div></div>';
  }
  h+='</div>';

  // Charts
  h+='<div class="cols">';
  h+='<div class="chart-box"><h3>GPU Usage</h3><div class="chart-area"><canvas id="c1"></canvas></div></div>';
  h+='<div class="chart-box"><h3>Queue & Users</h3><div class="chart-area"><canvas id="c2"></canvas></div></div>';
  h+='</div>';

  document.getElementById('app').innerHTML=h;
  charts(d.history||[]);
}

function charts(hist){
  Object.values(CH).forEach(c=>c?.destroy()); CH={u:null,q:null};
  if(!hist.length)return;
  const L=hist.map(h=>new Date(h.timestamp));
  const g='rgba(42,42,40,0.6)', tk='#7c7b75';
  const tip={backgroundColor:'#222221',borderColor:'#363633',borderWidth:1,titleColor:'#eeeeec',bodyColor:'#b5b3ad',
    titleFont:{family:'Plus Jakarta Sans',weight:600},bodyFont:{family:'JetBrains Mono',size:11},padding:8,cornerRadius:6};
  const base={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{color:tk,usePointStyle:true,pointStyle:'circle',boxWidth:5,font:{size:10,family:'Plus Jakarta Sans'}}},tooltip:tip},
    scales:{x:{type:'time',time:{tooltipFormat:'MMM d, HH:mm'},grid:{color:g},ticks:{color:tk,maxTicksLimit:7,font:{size:9}}},
      y:{beginAtZero:true,grid:{color:g},ticks:{color:tk,font:{size:9,family:'JetBrains Mono'}}}}};
  const ln=(c,bg)=>({borderColor:c,backgroundColor:bg,fill:true,tension:0.4,pointRadius:0,borderWidth:1.5});

  const e1=document.getElementById('c1');
  if(e1)CH.u=new Chart(e1,{type:'line',data:{labels:L,datasets:[
    {label:'Used',data:hist.map(h=>h.used),...ln('#e5736e','rgba(229,115,110,0.06)')},
    {label:'Free',data:hist.map(h=>h.free),...ln('#5ec49e','rgba(94,196,158,0.06)')},
    {label:'Down',data:hist.map(h=>h.down),...ln('#5a5955','rgba(90,89,85,0.04)'),borderWidth:1},
  ]},options:base});

  const e2=document.getElementById('c2');
  if(e2)CH.q=new Chart(e2,{type:'line',data:{labels:L,datasets:[
    {label:'Queued',data:hist.map(h=>h.pending_jobs||0),...ln('#d4a03c','rgba(212,160,60,0.06)'),yAxisID:'y'},
    {label:'Users',data:hist.map(h=>h.active_users||0),...ln('#9b8acd','rgba(155,138,205,0.06)'),yAxisID:'y1'},
  ]},options:{...base,scales:{...base.scales,y:{...base.scales.y,position:'left'},
    y1:{beginAtZero:true,position:'right',grid:{drawOnChartArea:false},ticks:{color:'#9b8acd',font:{size:9,family:'JetBrains Mono'}}}}}});
}

async function init(){await load();if(cur!=='overview'&&!D[cur])cur='overview';tabs();render()}
document.getElementById('fab').onclick=async function(){this.classList.add('spin');await load();tabs();render();this.classList.remove('spin')};
setInterval(async()=>{await load();tabs();render()},60000);
init();
</script>
</body>
</html>
